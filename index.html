DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERES UN BOT 🌻</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff8c6, #ffd95a, #fff1a8);

            display: flex;
            justify-content: center;
            align-items: flex-start;

            /* CORREGIDO */
            overflow-x: hidden;
            overflow-y: auto;

            padding: 30px 0;
        }

        .contenedor {
            width: 90%;
            max-width: 650px;

            padding: 40px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.88);

            border-radius: 30px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);

            position: relative;
            z-index: 2;
        }

        h1 {
            color: #e6a700;
            font-size: 42px;
            margin-bottom: 25px;
            line-height: 1.2;
        }

        .flores {
            font-size: 70px;
            animation: movimiento 2s infinite alternate;
            margin-bottom: 25px;
        }

        p {
            color: #5c4a00;
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .mensaje {
            font-size: 24px;
            font-weight: bold;
            color: #d18b00;
            margin-top: 25px;
        }

        .firma {
            margin-top: 25px;
            font-size: 20px;
            color: #806000;
            font-style: italic;
        }

        button {
            margin-top: 30px;

            padding: 16px 28px;

            border: none;
            border-radius: 30px;

            background: #f4b400;
            color: white;

            font-size: 19px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #d99b00;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Flores que caen */

        .flor {
            position: fixed;
            font-size: 35px;
            animation: caer 8s linear infinite;
            top: -50px;
            z-index: 1;
            pointer-events: none;
        }

        .flor:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .flor:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }

        .flor:nth-child(3) {
            left: 55%;
            animation-delay: 4s;
        }

        .flor:nth-child(4) {
            left: 80%;
            animation-delay: 1s;
        }

        @keyframes caer {

            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes movimiento {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }
        }

        /* Ajustes para celular */

        @media (max-width: 600px) {

            body {
                padding: 20px 0;
            }

            .contenedor {
                width: 92%;
                padding: 30px 20px;
                border-radius: 25px;
            }

            .flores {
                font-size: 50px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 18px;
            }

            .mensaje {
                font-size: 21px;
            }

            .firma {
                font-size: 18px;
            }

            button {
                font-size: 18px;
                padding: 15px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Flores que caen -->
    <div class="flor">🌻</div>
    <div class="flor">🌼</div>
    <div class="flor">🌻</div>
    <div class="flor">🌼</div>


    <!-- Contenido principal -->
    <div class="contenedor">

        <div class="flores">
            💀💀💀
        </div>

        <h1>
            ERES UN BOT 😂💀
        </h1>

        <p>
            Hoy quiero decirte que eres un bot en el free fire
        </p>

        <p>
            Porque no puedes levantar mira y solo te matas
        </p>

        <div class="mensaje">
            🥷 Gracias por ser el mishero de la escuadra🥷
        </div>

        <div class="firma">
            Eres un manco  💀
        </div>

        <button onclick="mostrarMensaje()">
            💀Presiona aquí bot💀
        </button>

    </div>


    <script>

        function mostrarMensaje() {

            alert(
                "🥷 no dejes que nadie te humille juega perro 🥷"
            );

        }

    </script>

</body>
</html>
