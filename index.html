<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 🌻</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff8c6, #ffd95a, #fff1a8);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .contenedor {
            width: 90%;
            max-width: 650px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #e6a700;
            font-size: 42px;
            margin-bottom: 20px;
        }

        .flores {
            font-size: 70px;
            animation: movimiento 2s infinite alternate;
            margin-bottom: 20px;
        }

        p {
            color: #5c4a00;
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .mensaje {
            font-size: 24px;
            font-weight: bold;
            color: #d18b00;
            margin-top: 20px;
        }

        .firma {
            margin-top: 25px;
            font-size: 18px;
            color: #806000;
            font-style: italic;
        }

        .flor {
            position: absolute;
            font-size: 35px;
            animation: caer 8s linear infinite;
            top: -50px;
        }

        .flor:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .flor:nth-child(2) {
            left: 30%;
            animation-delay: 2s;
        }

        .flor:nth-child(3) {
            left: 55%;
            animation-delay: 4s;
        }

        .flor:nth-child(4) {
            left: 80%;
            animation-delay: 1s;
        }

        @keyframes caer {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes movimiento {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }
        }

        button {
            margin-top: 20px;
            padding: 14px 25px;
            border: none;
            border-radius: 25px;
            background: #f4b400;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d99b00;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <!-- Flores que caen -->
    <div class="flor">🌻</div>
    <div class="flor">🌼</div>
    <div class="flor">🌻</div>
    <div class="flor">🌼</div>

    <div class="contenedor">

        <div class="flores">
            🌻🌻🌻
        </div>

        <h1>PARA MI AMOR BONITA PRECIOSA,MI MELLL 💛</h1>

        <p>
            Hoy quiero regalarte estas flores amarillas
            como símbolo de cariño, alegría y amor.
        </p>

        <p>
            Porque cada flor representa un momento bonito
            y cada pétalo lleva un pequeño recuerdo.
        </p>

        <div class="mensaje">
            🌻 Gracias por llenar mis días de felicidad 🌻
        </div>

        <div class="firma">
            Con mucho cariño 💛
        </div>

        <button onclick="mostrarMensaje()">
            💛 Presiona aquí 💛
        </button>

    </div>

    <script>
        function mostrarMensaje() {
            alert("🌻 RECUERDA QUE SIEMPRE SERAS LA LUZ DE MIS OJITOS MY LOVE💛");
        }
    </script>

</body>
</html>
